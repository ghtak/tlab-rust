[package]
name = "tlab-boilerplate"
version = "0.1.0"
edition = "2024"

[dependencies]
tlab = { path = "../tlab" }
anyhow = "1.0.104"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }

tower-http = { version = "0.7.1", features = ["fs", "trace"] }
serde_json = "1.0"
chrono = "0.4.45"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = [
    "chrono",
    "json",
    "postgres",
    "runtime-tokio",
    "uuid",
] }

[dev-dependencies]
