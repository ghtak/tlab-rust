[package]
name = "tlab"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
config = "0.15.25"
futures-core = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "uuid",
    "chrono",
    "json",
    "sqlite",
    "mysql",
] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
